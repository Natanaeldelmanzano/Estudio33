<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preload" href="/fonts/gloock-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/hanken-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/formulario.css">
</head>
<body class="cuerpo-form">
<div class="form-pantalla">
  <div class="form-barra" aria-hidden="true"><span id="progreso"></span></div>
  <header class="form-cab">
    <a class="logo" href="/" aria-label="Estudio 33 Real Estate, ir al inicio">{{logo_html}}</a>
    <a class="form-cerrar" href="/" aria-label="Salir del formulario y volver a la web">Salir</a>
  </header>
  <main class="escena" id="escena"></main>
  <footer class="form-pie">
    <button class="enlace-suave" id="atras" type="button" hidden>← Atrás</button>
    <button class="pildora pildora--grande" id="siguiente" type="button">Empezar</button>
  </footer>
  <div class="hp" aria-hidden="true"><label>No rellenar <input type="checkbox" id="botcheck" tabindex="-1" autocomplete="off"></label></div>
</div>
<noscript><p style="padding:2rem">Para completar este formulario necesitas activar JavaScript. También puedes llamarnos o escribirnos por WhatsApp al {{telefono_visible}}.</p></noscript>
<script type="application/json" id="config-formulario">{{config_json}}</script>
<script src="/js/formulario.js" defer></script>
</body>
</html>
